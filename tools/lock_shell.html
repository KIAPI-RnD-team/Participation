<!doctype html>
<html lang="ko"><head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>전략기획 과제 참여 현황</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' rx='6' fill='%231d4ed8'/%3E%3Crect x='5' y='5' width='5' height='5' rx='1.5' fill='%23fff'/%3E%3Crect x='12' y='5' width='5' height='5' rx='1.5' fill='%2399b9f7'/%3E%3Crect x='5' y='12' width='5' height='5' rx='1.5' fill='%2399b9f7'/%3E%3Crect x='12' y='12' width='5' height='5' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#111827;--muted:#6e7684;--line:#e2e6ec;--accent:#1d4ed8;--red:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaee;--muted:#9aa3b2;--line:#2a2f3a;--accent:#6b9bff;--red:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font-family:'Pretendard',"Noto Sans KR","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
h1{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.row{display:flex;align-items:center;gap:6px;margin:12px 0 18px;font-size:13px;color:var(--muted)}
button{width:100%;font:inherit;font-size:15px;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
</style></head>
<body>
<form id="f" autocomplete="off">
 <h1>전략기획 과제 참여 현황</h1>
 <p>비밀번호를 입력해야 볼 수 있습니다.</p>
 <label for="pw">비밀번호</label>
 <input id="pw" type="password" autofocus required>
 <div class="row"><input id="keep" type="checkbox"><label for="keep" style="margin:0;font-weight:500">이 기기에서 기억하기</label></div>
 <button id="go">열기</button>
 <div class="err" id="err" role="alert"></div>
</form>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function(){
 var P=JSON.parse(document.getElementById('payload').textContent),K='participation-key-'+P.salt;
 var d=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
 var e=function(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b)))};
 function get(st){try{return st.getItem(K)}catch(_){return null}}
 function put(st,v){try{st.setItem(K,v)}catch(_){}}
 function open(raw){
  return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])
   .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.iv)},k,d(P.ct))})
   .then(function(pt){var h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();});
 }
 function derive(pw){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits'])
   .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:d(P.salt),iterations:P.iter},k,256)});
 }
 var saved=get(sessionStorage)||get(localStorage);
 if(saved){open(d(saved)).catch(function(){try{sessionStorage.removeItem(K);localStorage.removeItem(K)}catch(_){}});}
 document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='확인 중…';err.textContent='';
  var keep=document.getElementById('keep').checked;
  derive(document.getElementById('pw').value).then(function(raw){
   return open(raw).then(function(){
    var v=e(raw);put(sessionStorage,v);if(keep)put(localStorage,v);
   });
  }).catch(function(){
   btn.disabled=false;btn.textContent='열기';err.textContent='비밀번호가 맞지 않습니다.';
   var i=document.getElementById('pw');i.select();
  });
 });
})();
</script>
</body></html>
